name: Deploy Frontend PR Preview
run-name: PR Preview - ${{ github.actor }} - PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - cleanup
      pr_number:
        description: 'PR number for cleanup'
        required: false
        type: string
  push:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  prepare-deployment:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      env_hash: ${{ steps.prepare-parameters.outputs.env_hash }}
      backend_stack_name: ${{ steps.prepare-parameters.outputs.backend_stack_name }}
      frontend_stack_name: ${{ steps.prepare-parameters.outputs.frontend_stack_name }}
    steps:
      - name: Prepare parameters
        id: prepare-parameters
        run: |
          ENV_DESCRIPTOR="pr-${{ github.actor }}"
          ENV_HASH=$(echo -n "$ENV_DESCRIPTOR" | sha1sum | cut -c1-6)
          BACKEND_STACK_NAME="babbling-brook-dev"
          FRONTEND_STACK_NAME="babbling-brook-frontend-pr-$ENV_HASH"

          echo "env_hash=$ENV_HASH" >> $GITHUB_OUTPUT
          echo "backend_stack_name=$BACKEND_STACK_NAME" >> $GITHUB_OUTPUT
          echo "frontend_stack_name=$FRONTEND_STACK_NAME" >> $GITHUB_OUTPUT

          echo "Environment Hash: $ENV_HASH"
          echo "Backend Stack: $BACKEND_STACK_NAME"
          echo "Frontend Stack: $FRONTEND_STACK_NAME"

  deploy-infrastructure:
    name: Deploy Infrastructure
    needs: [prepare-deployment]
    # if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.PIPELINE_EXECUTION_ROLE }}

      - name: Generate samconfig
        working-directory: frontend
        env:
          STACK_NAME: ${{ needs.prepare-deployment.outputs.frontend_stack_name }}
          ENV_HASH: ${{ needs.prepare-deployment.outputs.env_hash }}
        run: |
          envsubst < samconfig.yaml.template > samconfig.yaml
          echo "Generated samconfig.yaml:"
          cat samconfig.yaml

      - name: Deploy frontend stack
        working-directory: frontend
        run: |
          sam build --template-file template.yaml

          sam deploy \
            --config-file samconfig.yaml \
            --config-env dev \
            --s3-bucket "${{ secrets.ARTIFACTS_BUCKET_NAME }}" \
            --role-arn "${{ secrets.CLOUDFORMATION_EXECUTION_ROLE }}" \
            --no-fail-on-empty-changeset

  build-and-deploy:
    name: Build and Deploy
    needs: [prepare-deployment, deploy-infrastructure]
    # if: always() && needs.prepare-deployment.result == 'success' && needs.deploy-infrastructure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.PIPELINE_EXECUTION_ROLE }}

      - name: Retrieve backend outputs
        id: backend-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.prepare-deployment.outputs.backend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)

          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.prepare-deployment.outputs.backend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
            --output text)

          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.prepare-deployment.outputs.backend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' \
            --output text)

          USER_POOL_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.prepare-deployment.outputs.backend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolDomain`].OutputValue' \
            --output text)

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "user_pool_id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "user_pool_client_id=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "user_pool_domain=$USER_POOL_DOMAIN" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React application
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.backend-outputs.outputs.api_url }}
          VITE_USER_POOL_ID: ${{ steps.backend-outputs.outputs.user_pool_id }}
          VITE_USER_POOL_CLIENT_ID: ${{ steps.backend-outputs.outputs.user_pool_client_id }}
          VITE_USER_POOL_DOMAIN: ${{ steps.backend-outputs.outputs.user_pool_domain }}
          VITE_AWS_REGION: us-east-1
        run: |
          npm run build

          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi

      - name: Upload to S3
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.prepare-deployment.outputs.frontend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
            --output text)

          aws s3 sync frontend/dist s3://$BUCKET_NAME \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.txt"

          aws s3 cp frontend/dist/index.html s3://$BUCKET_NAME/index.html \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.prepare-deployment.outputs.frontend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id $DISTRIBUTION_ID \
            --id $INVALIDATION_ID

      - name: Get preview URL
        id: preview-url
        run: |
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.prepare-deployment.outputs.frontend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontUrl`].OutputValue' \
            --output text)

          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.preview-url.outputs.cloudfront_url }}';
            const stackName = '${{ needs.prepare-deployment.outputs.frontend_stack_name }}';
            const envHash = '${{ needs.prepare-deployment.outputs.env_hash }}';

            const commentBody = `## 🚀 PR Preview Deployed

            Your preview environment is ready!

            **Preview URL:** ${previewUrl}

            **Stack Name:** \`${stackName}\`
            **Environment Hash:** \`${envHash}\`

            ### 📝 Notes
            - This preview connects to the **dev backend** environment
            - Changes to this PR will automatically update the preview
            - The preview will remain active until manually cleaned up

            ### 🧹 Cleanup Instructions
            To delete this preview environment, run the cleanup workflow:
            1. Go to [Actions → Deploy Frontend PR Preview](https://github.com/${{ github.repository }}/actions/workflows/deploy-frontend-pr.yaml)
            2. Click "Run workflow"
            3. Select \`cleanup\` action
            4. Enter PR number: \`${{ github.event.pull_request.number }}\`

            ---
            *Last updated: ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('PR Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  cleanup:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'cleanup'
    steps:
      - name: Calculate environment hash
        id: calc-hash
        run: |
          ENV_DESCRIPTOR="pr-${{ github.actor }}"
          ENV_HASH=$(echo -n "$ENV_DESCRIPTOR" | sha1sum | cut -c1-6)
          FRONTEND_STACK_NAME="babbling-brook-frontend-pr-$ENV_HASH"

          echo "env_hash=$ENV_HASH" >> $GITHUB_OUTPUT
          echo "frontend_stack_name=$FRONTEND_STACK_NAME" >> $GITHUB_OUTPUT

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.PIPELINE_EXECUTION_ROLE }}

      - name: Empty S3 bucket
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ steps.calc-hash.outputs.frontend_stack_name }} \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
            --output text 2>/dev/null || echo "")

          if [ -n "$BUCKET_NAME" ]; then
            echo "Emptying bucket: $BUCKET_NAME"
            aws s3 rm s3://$BUCKET_NAME --recursive
          else
            echo "Stack not found or bucket already deleted"
          fi

      - name: Delete CloudFormation stack
        run: |
          STACK_NAME="${{ steps.calc-hash.outputs.frontend_stack_name }}"

          if aws cloudformation describe-stacks --stack-name $STACK_NAME 2>/dev/null; then
            echo "Deleting stack: $STACK_NAME"
            aws cloudformation delete-stack --stack-name $STACK_NAME

            echo "Waiting for stack deletion to complete..."
            aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME

            echo "Stack deleted successfully"
          else
            echo "Stack not found: $STACK_NAME"
          fi

      - name: Post cleanup confirmation
        if: github.event.inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const stackName = '${{ steps.calc-hash.outputs.frontend_stack_name }}';
            const prNumber = '${{ github.event.inputs.pr_number }}';

            const commentBody = `## 🧹 PR Preview Cleaned Up

            The preview environment has been deleted.

            **Stack Name:** \`${stackName}\`

            All resources including S3 bucket and CloudFront distribution have been removed.

            ---
            *Cleaned up: ${new Date().toISOString()}*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: commentBody
            });
