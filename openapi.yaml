openapi: 3.0.0
info:
  title: Episode API
  version: 1.0.0
  description: Management for episodes

x-amazon-apigateway-request-validators:
  Validate All:
    validateRequestParameters: true
    validateRequestBody: true
x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: '{ "message": "$context.error.validationErrorString" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin:
        Fn::Sub: "'${CORSOrigin}'"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin:
        Fn::Sub: "'${CORSOrigin}'"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin:
        Fn::Sub: "'${CORSOrigin}'"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

tags:
  - name: Episodes
  - name: Uploads
  - name: Clips
  - name: Teams
  - name: Users
paths:
  /episodes:
    get:
      summary: List all episodes
      description: Gets a paginated list of episodes with their name, air date, and current status
      tags: [Episodes]
      responses:
        200:
          description: List of episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EpisodeListView"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListEpisodesFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    post:
      summary: Create episode
      description: Creates a new episode with metadata
      tags: [Episodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                episodeNumber:
                  type: integer
                description:
                  type: string
                airDate:
                  type: string
                  description: ISO-8601 date or datetime string
                platforms:
                  type: array
                  items:
                    type: string
                    enum: ["linkedin live", "X", "twitch", "youtube"]
                themes:
                  type: array
                  items:
                    type: string
                seriesName:
                  type: string
              required: [title, episodeNumber]
      responses:
        201:
          description: Episode created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        400:
          description: Invalid request
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateEpisodeFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      summary: Get episode by ID
      description: Retrieves a single episode with all its metadata and current status
      tags: [Episodes]
      responses:
        200:
          description: Episode details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetEpisodeFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/transcripts:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      summary: Create transcript upload URL
      description: Returns a presigned S3 URL to upload the transcript for an episode
      tags: [Uploads]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: Original client-side filename to persist as S3 object metadata
                  example: "meeting-transcript-2025-01-15.srt"
      responses:
        200:
          description: Presigned URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: "123e4567-e89b-12d3-a456-426614174000/transcript.srt"
                  uploadUrl:
                    type: string
                  expiresAt:
                    type: string
                  requiredHeaders:
                    type: object
                    additionalProperties:
                      type: string
                    description: Headers you must include when uploading (present if filename supplied)
        400:
          description: Invalid request
        404:
          description: Episode not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTranscriptUploadFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      summary: List tracks for episode
      description: Gets a list of all tracks associated with an episode
      tags: [Episodes]
      responses:
        200:
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Track identifier (same as name)
                      example: "main"
                    name:
                      type: string
                      description: Track name
                      example: "main"
                    status:
                      type: string
                      description: Current track status
                      example: "processed"
        400:
          description: Invalid request
        401:
          description: Unauthorized
        404:
          description: Episode not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListTracksFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    post:
      summary: Initiate track upload
      description: Starts a multipart upload for a video track and returns uploadId and required headers
      tags: [Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, trackName]
              properties:
                filename:
                  type: string
                  description: Original filename of the video file
                  example: "main-camera-feed.mp4"
                trackName:
                  type: string
                  description: Logical name for the track (e.g., main, guest, screenshare)
                  example: "main"
                speakers:
                  type: array
                  description: Optional array of speaker names associated with this track. If not provided, defaults to empty array.
                  items:
                    type: string
                    minLength: 1
                    description: Speaker name (non-empty string, will be trimmed of whitespace)
                  example: ["host", "guest1", "guest2"]
      responses:
        200:
          description: Upload initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  uploadId:
                    type: string
                  expiresAt:
                    type: string
                  requiredHeaders:
                    type: object
                    additionalProperties:
                      type: string
        400:
          description: Invalid request
        404:
          description: Episode not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTrackUploadFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks/{trackName}/parts:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/TrackName"
    post:
      summary: Sign part upload URLs
      description: Returns presigned URLs for specific part numbers of a multipart upload
      tags: [Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, partNumbers]
              properties:
                uploadId:
                  type: string
                partNumbers:
                  type: array
                  items:
                    type: integer
      responses:
        200:
          description: Signed URLs for parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        partNumber:
                          type: integer
                        url:
                          type: string
        400:
          description: Invalid request
        404:
          description: Upload not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignTrackPartsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks/{trackName}/complete:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/TrackName"
    post:
      summary: Complete track upload
      description: Completes the multipart upload and records track metadata on the episode
      tags: [Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, parts]
              properties:
                uploadId:
                  type: string
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      ETag:
                        type: string
                      PartNumber:
                        type: integer
      responses:
        200:
          description: Upload completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  trackName:
                    type: string
        400:
          description: Invalid request
        404:
          description: Upload not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CompleteTrackUploadFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks/{trackName}:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/TrackName"
    put:
      summary: Update track metadata
      description: Updates track metadata including speakers array. Replaces the existing speakers array completely.
      tags: [Episodes]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackUpdateRequest"
            examples:
              update_speakers:
                summary: Update speakers array
                value:
                  speakers: ["host", "guest1", "guest2"]
              remove_speakers:
                summary: Remove all speakers
                value:
                  speakers: []
              empty_request:
                summary: No changes (empty request body)
                value: {}
      responses:
        204:
          description: Track updated successfully
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid request data - speakers array contains invalid values
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode or track not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateTrackFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/statuses:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      summary: Update episode status
      description: Updates episode status with prerequisite validation and triggers appropriate events
      tags: [Episodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["Ready for Clip Gen"]
                  description: The new status to set for the episode
              required: [status]
            examples:
              ready_for_clip_gen:
                summary: Mark episode ready for clip generation
                value:
                  status: "Ready for Clip Gen"
      responses:
        204:
          description: Status updated successfully
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid request data or status value
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode not found
        409:
          $ref: "#/components/responses/PrerequisiteNotMet"
          description: Prerequisites not met for status transition
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateEpisodeStatusFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/clips:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      summary: List clips for episode
      description: Retrieves all clips for a specific episode with current status computed from status history
      tags: [Clips]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 25
          description: Number of items to return (default 10, max 25)
        - in: query
          name: nextToken
          schema:
            type: string
          description: Opaque cursor returned by a previous call to continue paging
      responses:
        200:
          description: List of clips for the episode with paging
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClipListView"
                  count:
                    type: integer
                    description: Number of items in this page
                  nextToken:
                    type: string
                    description: Opaque cursor to fetch the next page
                required:
                  - items
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListClipsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/clips/{clipId}:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/ClipId"
    get:
      summary: Get clip by ID
      description: Retrieves a specific clip with current status computed from status history
      tags: [Clips]
      responses:
        200:
          description: Clip details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipDetail"
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode or clip not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetClipFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    patch:
      summary: Update clip status
      description: Updates the status of a clip for review workflow (reviewed, approved, rejected, published)
      tags: [Clips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["reviewed", "approved", "rejected", "published"]
                  description: New status for the clip
              required:
                - status
      responses:
        200:
          description: Clip status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  clipId:
                    type: string
                    description: Clip identifier
                  episodeId:
                    type: string
                    description: Episode identifier
                  status:
                    type: string
                    description: Updated status
                  updatedAt:
                    type: string
                    format: date-time
                    description: Timestamp when status was updated
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateClipStatusFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    delete:
      summary: Delete clip
      description: Deletes a clip and all associated S3 files. Returns 204 on success or if clip doesn't exist (idempotent). Updates tenant statistics to increment clips deleted count.
      tags: [Clips]
      responses:
        204:
          description: Clip deleted successfully or clip not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteClipFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/clips/{clipId}/play:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/ClipId"
    get:
      summary: Play clip
      description: Generates a download URL for the clip video file and increments the view count. The clip must be in processed, approved, or published status to be playable.
      tags: [Clips]
      responses:
        200:
          description: Clip playback information with download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  clipId:
                    type: string
                    description: Clip identifier
                  episodeId:
                    type: string
                    description: Episode identifier
                  title:
                    type: string
                    description: Clip title
                  downloadUrl:
                    type: string
                    format: uri
                    description: Presigned S3 URL for downloading the clip video file
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the download URL expires (1 hour from generation)
                  duration:
                    type: string
                    description: Clip duration in HH:MM:SS format
                  fileSize:
                    type: integer
                    description: File size in bytes
                  viewCount:
                    type: integer
                    description: Updated view count after incrementing
                required:
                  - clipId
                  - episodeId
                  - title
                  - downloadUrl
                  - expiresAt
                  - viewCount
        400:
          $ref: "#/components/responses/BadRequest"
          description: Clip is not ready for playback
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode, clip, or video file not found
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PlayClipFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /teams:
    get:
      summary: List user's teams
      description: Gets a list of all teams where the user is a member
      tags: [Teams]
      responses:
        200:
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamListView"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListTeamsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    post:
      summary: Create team
      description: Creates a new team with the user as owner
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Team name (must be unique within user scope)
                description:
                  type: string
                  maxLength: 500
                  description: Optional team description
                settings:
                  type: object
                  description: Optional team settings
                  properties:
                    defaultPlatforms:
                      type: array
                      items:
                        type: string
                        enum: ["linkedin live", "X", "twitch", "youtube"]
                      description: Default platforms for team episodes
                    timezone:
                      type: string
                      description: Team timezone
                      example: "America/New_York"
              required: [name]
      responses:
        201:
          description: Team created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Team identifier
                  name:
                    type: string
                    description: Team name
                  ownerId:
                    type: string
                    description: User ID of team owner
                  createdAt:
                    type: string
                    format: date-time
                required: [id, name, ownerId, createdAt]
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid request data or team name already exists
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTeamFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      summary: Get team details
      description: Retrieves team information for authorized users
      tags: [Teams]
      responses:
        200:
          description: Team details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not a member of this team
        404:
          $ref: "#/components/responses/NotFound"
          description: Team not found
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTeamFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    put:
      summary: Update team
      description: Updates team information (owner only)
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Team name
                description:
                  type: string
                  maxLength: 500
                  description: Team description
                settings:
                  type: object
                  description: Team settings
                  properties:
                    defaultPlatforms:
                      type: array
                      items:
                        type: string
                        enum: ["linkedin live", "X", "twitch", "youtube"]
                    timezone:
                      type: string
      responses:
        200:
          description: Team updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not the team owner
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateTeamFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    delete:
      summary: Delete team
      description: Deletes team and all associated data (owner only)
      tags: [Teams]
      responses:
        204:
          description: Team deleted successfully
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not the team owner
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteTeamFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /me:
    get:
      summary: Get user profile
      description: Retrieves the current user's profile information including active team
      tags: [Users]
      responses:
        200:
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetUserProfileFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    put:
      summary: Update user profile
      description: Updates user profile information and preferences
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: User display name
                preferences:
                  type: object
                  description: User preferences and settings
                  properties:
                    timezone:
                      type: string
                      description: User timezone
                      example: "America/New_York"
                    notifications:
                      type: boolean
                      description: Enable notifications
                      example: true
      responses:
        200:
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateUserProfileFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /me/teams:
    post:
      summary: Set active team
      description: Sets the user's active team context or clears it for individual mode
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: Team ID to activate, or null to switch to individual mode
                  nullable: true
                  example: "team-123e4567-e89b-12d3-a456-426614174000"
      responses:
        200:
          description: Active team updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeTeamId:
                    type: string
                    nullable: true
                    description: Current active team ID
                  message:
                    type: string
                    description: Success message
                    example: "Active team updated successfully"
                  requiresTokenRefresh:
                    type: boolean
                    description: Always false - cache is automatically flushed server-side
                    example: false
                required: [activeTeamId, message, requiresTokenRefresh]
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid team ID or user not a member of specified team
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
          description: Team not found
        422:
          description: User not a member of specified team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "UnprocessableEntity"
                message: "User is not a member of the specified team"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SetActiveTeamFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

components:
  parameters:
    EpisodeId:
      in: path
      name: episodeId
      required: true
      schema:
        type: string
    TrackName:
      in: path
      name: trackName
      required: true
      schema:
        type: string
    ClipId:
      in: path
      name: clipId
      required: true
      schema:
        type: string
    TeamId:
      in: path
      name: teamId
      required: true
      schema:
        type: string
  schemas:
    EpisodeListView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          description: Current episode status computed from the most recent status history entry
        airDate:
          type: string
          format: date-time
      required:
        - id
        - title

    ClipListView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          description: Current clip status
          enum:
            [
              "detected",
              "processing",
              "processed",
              "failed",
              "reviewed",
              "approved",
              "rejected",
              "published",
            ]
        duration:
          type: string
          description: Duration of the clip (HH:MM:SS format)
          example: "00:02:15"
        type:
          type: string
          description: Clip type identifier
      required:
        - id
        - title
        - status
        - duration

    Episode:
      type: object
      properties:
        id:
          type: string
          description: Unique episode identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: Episode title
          example: "Tech Talk Episode 42"
        status:
          type: string
          description: Current episode status computed from the most recent entry in the status history array. This field is maintained for backward compatibility while the complete status history is stored internally.
          example: "Ready for Clip Gen"
        episodeNumber:
          type: integer
          description: Episode number in the series
          example: 42
        summary:
          type: string
          description: Episode summary or description
          example: "Discussion about AI and machine learning"
        airDate:
          type: string
          format: date-time
          description: When the episode was aired
          example: "2025-01-15T10:30:00Z"
        platforms:
          type: array
          description: Platforms where the episode was published
          items:
            type: string
            enum: ["linkedin live", "X", "twitch", "youtube"]
          example: ["twitch", "youtube"]
        themes:
          type: array
          description: Episode themes or topics
          items:
            type: string
          example: ["technology", "programming"]
        seriesName:
          type: string
          description: Name of the series this episode belongs to
          example: "Tech Talk Series"
        createdAt:
          type: string
          format: date-time
          description: When the episode was created
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When the episode was last updated
          example: "2025-01-15T10:35:00Z"
      required:
        - id
        - title
        - status
        - episodeNumber
        - createdAt
        - updatedAt

    TrackUpdateResponse:
      type: object
      properties:
        trackName:
          type: string
          description: Name of the updated track
          example: "main"
        speakers:
          type: array
          description: Updated speakers array
          items:
            type: string
          example: ["host", "guest1", "guest2"]
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when track was last updated
          example: "2025-01-15T10:35:00Z"
      required:
        - trackName
        - speakers
        - updatedAt

    TrackUpdateRequest:
      type: object
      properties:
        speakers:
          type: array
          description: Array of speaker names associated with this track. Replaces existing speakers array completely. Empty array removes all speakers.
          items:
            type: string
            minLength: 1
            description: Speaker name (non-empty string, will be trimmed of whitespace)
          example: ["host", "guest1", "guest2"]

    Clip:
      type: object
      properties:
        id:
          type: string
          description: Unique clip identifier
          example: "clip-uuid"
        episodeId:
          type: string
          description: Episode this clip belongs to
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: Clip title
          example: "Interesting Discussion Point"
        description:
          type: string
          description: AI-generated description of the clip content
          example: "Discussion about machine learning applications"
        status:
          type: string
          description: Current clip status computed from the most recent entry in the status history array. This field is maintained for backward compatibility while the complete status history is stored internally.
          enum:
            [
              "detected",
              "processing",
              "processed",
              "failed",
              "reviewed",
              "approved",
              "rejected",
              "published",
            ]
          example: "processed"
        startTime:
          type: string
          description: Start time in the episode (HH:MM:SS format)
          example: "00:15:30"
        endTime:
          type: string
          description: End time in the episode (HH:MM:SS format)
          example: "00:17:45"
        duration:
          type: string
          description: Duration of the clip (HH:MM:SS format)
          example: "00:02:15"
        tags:
          type: array
          description: Tags associated with the clip
          items:
            type: string
          example: ["discussion", "technical", "important"]
        createdAt:
          type: string
          format: date-time
          description: When the clip was created
          example: "2025-01-15T10:40:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When the clip was last updated
          example: "2025-01-15T10:42:15Z"
        processedAt:
          type: string
          format: date-time
          description: When the clip was processed (optional)
          example: "2025-01-15T10:42:15Z"
        s3Key:
          type: string
          description: S3 key for the processed clip file (optional)
          example: "tenant123/123e4567-e89b-12d3-a456-426614174000/clips/clip-uuid.mp4"
        fileSize:
          type: integer
          description: File size in bytes (optional)
          example: 15728640
      required:
        - id
        - episodeId
        - title
        - status
        - startTime
        - endTime
        - duration
        - tags
        - createdAt
        - updatedAt

    ClipDetail:
      allOf:
        - $ref: "#/components/schemas/Clip"
        - type: object
          properties:
            segments:
              type: array
              description: Detailed segments that make up this clip
              items:
                type: object
                properties:
                  startTime:
                    type: string
                    description: Segment start time (HH:MM:SS format)
                    example: "00:15:30"
                  endTime:
                    type: string
                    description: Segment end time (HH:MM:SS format)
                    example: "00:16:15"
                  text:
                    type: string
                    description: Transcript text for this segment
                    example: "This is the transcript text for this segment..."
                required:
                  - startTime
                  - endTime
                  - text
              example:
                - startTime: "00:15:30"
                  endTime: "00:16:15"
                  text: "This is the transcript text for this segment..."
            transcriptSegment:
              type: string
              description: Complete transcript text for the entire clip
              example: "This is the complete transcript text for this clip..."
            processingDuration:
              type: number
              format: float
              description: Time taken to process this clip in seconds (optional)
              example: 45.2
            processingMetadata:
              type: object
              description: Metadata about the processing (optional)
              properties:
                segmentCount:
                  type: integer
                  example: 3
                totalProcessingTime:
                  type: number
                  format: float
                  example: 45.2
                resolution:
                  type: string
                  example: "1920x1080"
                codec:
                  type: string
                  example: "h264"
            processingError:
              type: object
              description: Error information if processing failed (optional)
              properties:
                message:
                  type: string
                  example: "FFmpeg processing failed"
                code:
                  type: string
                  example: "FFMPEG_ERROR"
                timestamp:
                  type: string
                  format: date-time
                  example: "2025-01-15T10:42:00Z"
              required:
                - message
                - timestamp
            aiAnalysis:
              type: object
              description: AI analysis results (optional)
              properties:
                sentiment:
                  type: string
                  example: "positive"
                topics:
                  type: array
                  items:
                    type: string
                  example: ["technology", "innovation"]
                keyPhrases:
                  type: array
                  items:
                    type: string
                  example: ["machine learning", "artificial intelligence"]
                speakerCount:
                  type: integer
                  example: 2

    TeamListView:
      type: object
      properties:
        id:
          type: string
          description: Team identifier
          example: "team-123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: Team name
          example: "Content Team Alpha"
        role:
          type: string
          description: User's role in the team
          enum: ["owner", "member"]
          example: "owner"
        memberCount:
          type: integer
          description: Number of team members
          example: 3
        createdAt:
          type: string
          format: date-time
          description: When the team was created
          example: "2025-01-15T10:30:00Z"
      required:
        - id
        - name
        - role
        - createdAt

    Team:
      type: object
      properties:
        id:
          type: string
          description: Team identifier
          example: "team-123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: Team name
          example: "Content Team Alpha"
        description:
          type: string
          description: Team description
          example: "Main content creation team"
        ownerId:
          type: string
          description: User ID of team owner
          example: "user-456e7890-e89b-12d3-a456-426614174001"
        status:
          type: string
          description: Team status
          enum: ["active", "archived"]
          example: "active"
        settings:
          type: object
          description: Team settings
          properties:
            defaultPlatforms:
              type: array
              items:
                type: string
                enum: ["linkedin live", "X", "twitch", "youtube"]
              example: ["twitch", "youtube"]
            timezone:
              type: string
              example: "America/New_York"
        createdAt:
          type: string
          format: date-time
          description: When the team was created
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When the team was last updated
          example: "2025-01-15T10:35:00Z"
      required:
        - id
        - name
        - ownerId
        - status
        - createdAt
        - updatedAt

    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: User identifier
          example: "user-456e7890-e89b-12d3-a456-426614174001"
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        name:
          type: string
          description: User display name
          example: "John Doe"
        activeTeamId:
          type: string
          nullable: true
          description: Currently active team ID, null for individual mode
          example: "team-123e4567-e89b-12d3-a456-426614174000"
        preferences:
          type: object
          description: User preferences and settings
          properties:
            timezone:
              type: string
              example: "America/New_York"
            notifications:
              type: boolean
              example: true
        teams:
          type: array
          description: Teams the user belongs to
          items:
            type: object
            properties:
              teamId:
                type: string
                description: Team identifier
                example: "team-123e4567-e89b-12d3-a456-426614174000"
              teamName:
                type: string
                description: Team name
                example: "Content Team Alpha"
              role:
                type: string
                enum: ["owner", "member"]
                description: User's role in the team
                example: "owner"
              joinedAt:
                type: string
                format: date-time
                description: When user joined the team
                example: "2025-01-15T10:30:00Z"
            required: [teamId, teamName, role, joinedAt]
        createdAt:
          type: string
          format: date-time
          description: When the user account was created
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When the profile was last updated
          example: "2025-01-15T10:35:00Z"
      required:
        - id
        - email
        - name
        - activeTeamId
        - teams
        - createdAt
        - updatedAt

    StatusHistoryEntry:
      type: object
      properties:
        status:
          type: string
          description: The status value
          example: "Ready for Clip Gen"
        timestamp:
          type: string
          format: date-time
          description: When the status was set
          example: "2025-01-15T10:30:00Z"
      required:
        - status
        - timestamp

    PrerequisiteError:
      type: object
      properties:
        error:
          type: string
          description: Error type identifier
          example: "PrerequisiteNotMet"
        message:
          type: string
          description: Human-readable error message
          example: "Episode is not ready for clip generation"
        details:
          type: object
          properties:
            missingPrerequisites:
              type: array
              items:
                type: string
              description: List of specific prerequisite failures
              example:
                [
                  "Episode does not have 'Track(s) Uploaded' status",
                  "Track 'guest' has status 'uploading', expected 'Processed'",
                ]
      required:
        - error
        - message
        - details

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error type identifier
          example: "ValidationError"
        message:
          type: string
          description: Human-readable error message
          example: "The request body contains invalid data"

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation_error:
              summary: Validation error
              value:
                error: "ValidationError"
                message: "The request body contains invalid data"
            invalid_speakers:
              summary: Invalid speakers array
              value:
                error: "ValidationError"
                message: "Speaker names must be non-empty strings"
            empty_speaker_name:
              summary: Empty speaker name
              value:
                error: "ValidationError"
                message: "Speaker name cannot be empty or contain only whitespace"

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Unauthorized"
            message: "Valid JWT token required"

    Forbidden:
      description: Access denied - user lacks required permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            team_access_denied:
              summary: Team access denied
              value:
                error: "Forbidden"
                message: "User is not a member of this team"
            owner_required:
              summary: Owner privileges required
              value:
                error: "Forbidden"
                message: "Only team owners can perform this action"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            episode_not_found:
              summary: Episode not found
              value:
                error: "NotFound"
                message: "Episode with ID '123e4567-e89b-12d3-a456-426614174000' was not found"
            track_not_found:
              summary: Track not found
              value:
                error: "NotFound"
                message: "Track 'main' not found for episode '123e4567-e89b-12d3-a456-426614174000'"

    PrerequisiteNotMet:
      description: Prerequisites not met for the requested operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrerequisiteError"
          examples:
            episode_not_ready:
              summary: Episode not ready for clip generation
              value:
                error: "PrerequisiteNotMet"
                message: "Episode is not ready for clip generation"
                details:
                  missingPrerequisites:
                    - "Episode has status 'Draft', expected 'Track(s) Uploaded'"
                    - "Track 'guest' has status 'Unprocessed', expected 'Processed'"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "InternalError"
            message: "Something went wrong"
