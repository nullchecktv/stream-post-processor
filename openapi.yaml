openapi: 3.0.0
info:
  title: Episode API
  version: 1.0.0
  description: Management for episodes

x-amazon-apigateway-request-validators:
  Validate All:
    validateRequestParameters: true
    validateRequestBody: true
x-amazon-apigateway-gateway-responses:
  BAD_REQUEST_BODY:
    statusCode: 400
    responseTemplates:
      application/json: '{ "message": "$context.error.validationErrorString" }'
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin:
        Fn::Sub: "'${CORSOrigin}'"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin:
        Fn::Sub: "'${CORSOrigin}'"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin:
        Fn::Sub: "'${CORSOrigin}'"
      gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

tags:
  - name: Episodes
  - name: Uploads
  - name: Clips
  - name: Quotes
  - name: Teams
  - name: Users
  - name: Notifications
  - name: Invitations
paths:
  /episodes:
    get:
      summary: List all episodes
      description: Gets a paginated list of episodes with their name, air date, and current status
      tags: [Episodes]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextToken"
      responses:
        200:
          description: List of episodes with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EpisodeListView"
                  nextToken:
                    type: string
                    description: Token for next page (only present if more items available)
                required:
                  - items
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListEpisodesFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    post:
      summary: Create episode
      description: Creates a new episode with metadata
      tags: [Episodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  description: Episode title (required, non-empty)
                episodeNumber:
                  type: integer
                  description: Episode number (required, must be a valid integer)
                description:
                  type: string
                  description: Episode description (optional)
                airDate:
                  type: string
                  description: ISO-8601 date or datetime string (optional)
                platforms:
                  type: array
                  items:
                    type: string
                    enum: ["linkedin live", "X", "twitch", "youtube"]
                  description: Platforms where episode was published (optional)
                themes:
                  type: array
                  items:
                    type: string
                  description: Episode themes or topics (optional)
                seriesName:
                  type: string
                  description: Name of the series this episode belongs to (optional)
              required: [title, episodeNumber]
      responses:
        201:
          description: Episode created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique episode identifier
                required:
                  - id
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid request data - missing required fields or validation errors
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateEpisodeFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      summary: Get episode by ID
      description: Retrieves a single episode with all its metadata and current status
      tags: [Episodes]
      responses:
        200:
          description: Episode details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        404:
          description: Episode not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Episode with ID '123e4567-e89b-12d3-a456-426614174000' was not found"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "InternalError"
                  message:
                    type: string
                    example: "Something went wrong"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetEpisodeFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    put:
      summary: Update episode
      description: Updates an existing episode's metadata
      tags: [Episodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                episodeNumber:
                  type: integer
                  minimum: 1
                description:
                  type: string
                  maxLength: 1000
                airDate:
                  type: string
                  format: date-time
                platforms:
                  type: array
                  items:
                    type: string
                    enum: [linkedin live, X, twitch, youtube]
                themes:
                  type: array
                  items:
                    type: string
                seriesName:
                  type: string
                  maxLength: 100
      responses:
        204:
          description: Episode updated successfully
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          description: Episode not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        409:
          description: Conflict - episode was modified by another request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-request-validator: Validate All
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateEpisodeFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/transcripts:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      summary: Create transcript upload URL
      description: Returns a presigned S3 URL to upload the transcript for an episode
      tags: [Uploads]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  description: Original client-side filename to persist as S3 object metadata
                  example: "meeting-transcript-2025-01-15.srt"
      responses:
        200:
          description: Presigned URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: "123e4567-e89b-12d3-a456-426614174000/transcript.srt"
                  uploadUrl:
                    type: string
                  expiresAt:
                    type: string
                  requiredHeaders:
                    type: object
                    additionalProperties:
                      type: string
                    description: Headers you must include when uploading (present if filename supplied)
        400:
          description: Invalid request
        404:
          description: Episode not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTranscriptUploadFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      summary: List tracks for episode
      description: Gets a list of all tracks associated with an episode
      tags: [Episodes]
      responses:
        200:
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Track identifier (same as name)
                      example: "main"
                    name:
                      type: string
                      description: Track name
                      example: "main"
                    status:
                      type: string
                      description: Current track status
                      example: "processed"
        400:
          description: Invalid request
        401:
          description: Unauthorized
        404:
          description: Episode not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListTracksFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    post:
      summary: Initiate track upload
      description: Starts a multipart upload for a video track and returns uploadId and required headers
      tags: [Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, trackName]
              properties:
                filename:
                  type: string
                  description: Original filename of the video file
                  example: "main-camera-feed.mp4"
                trackName:
                  type: string
                  description: Logical name for the track (e.g., main, guest, screenshare)
                  example: "main"
                speakers:
                  type: array
                  description: Optional array of speaker names associated with this track. If not provided, defaults to empty array.
                  items:
                    type: string
                    minLength: 1
                    description: Speaker name (non-empty string, will be trimmed of whitespace)
                  example: ["host", "guest1", "guest2"]
      responses:
        200:
          description: Upload initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  uploadId:
                    type: string
                  expiresAt:
                    type: string
                  requiredHeaders:
                    type: object
                    additionalProperties:
                      type: string
        400:
          description: Invalid request
        404:
          description: Episode not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTrackUploadFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks/{trackName}/parts:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/TrackName"
    post:
      summary: Sign part upload URLs
      description: Returns presigned URLs for specific part numbers of a multipart upload
      tags: [Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, partNumbers]
              properties:
                uploadId:
                  type: string
                partNumbers:
                  type: array
                  items:
                    type: integer
      responses:
        200:
          description: Signed URLs for parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: array
                    items:
                      type: object
                      properties:
                        partNumber:
                          type: integer
                        url:
                          type: string
        400:
          description: Invalid request
        404:
          description: Upload not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignTrackPartsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks/{trackName}/complete:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/TrackName"
    post:
      summary: Complete track upload
      description: Completes the multipart upload and records track metadata on the episode
      tags: [Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId, parts]
              properties:
                uploadId:
                  type: string
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      ETag:
                        type: string
                      PartNumber:
                        type: integer
      responses:
        200:
          description: Upload completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  trackName:
                    type: string
        400:
          description: Invalid request
        404:
          description: Upload not found
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CompleteTrackUploadFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/tracks/{trackName}:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/TrackName"
    put:
      summary: Update track metadata
      description: Updates track metadata including speakers array. Replaces the existing speakers array completely.
      tags: [Episodes]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackUpdateRequest"
            examples:
              update_speakers:
                summary: Update speakers array
                value:
                  speakers: ["host", "guest1", "guest2"]
              remove_speakers:
                summary: Remove all speakers
                value:
                  speakers: []
              empty_request:
                summary: No changes (empty request body)
                value: {}
      responses:
        204:
          description: Track updated successfully
        400:
          description: Invalid request data - speakers array contains invalid values
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: '"speakers" must be an array'
        404:
          description: Episode or track not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Track 'main' not found for episode '123e4567-e89b-12d3-a456-426614174000'"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateTrackFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/statuses:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      summary: Get episode status
      description: Retrieves the current status and status history for an episode without full episode data
      tags: [Episodes]
      responses:
        200:
          description: Episode status details
          content:
            application/json:
              schema:
                type: object
                properties:
                  episodeId:
                    type: string
                    description: Episode identifier
                    example: "123e4567-e89b-12d3-a456-426614174000"
                  currentStatus:
                    type: string
                    description: Current episode status
                    example: "Processing"
                  statusHistory:
                    type: array
                    description: Chronological history of status changes
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: "Draft"
                        timestamp:
                          type: string
                          format: date-time
                          example: "2025-01-15T10:30:00Z"
                      required:
                        - status
                        - timestamp
                  updatedAt:
                    type: string
                    format: date-time
                    description: Last update timestamp
                    example: "2025-01-15T14:30:00Z"
                required:
                  - episodeId
                  - currentStatus
                  - statusHistory
                  - updatedAt
        404:
          description: Episode not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Episode with ID '123e4567-e89b-12d3-a456-426614174000' was not found"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "InternalError"
                  message:
                    type: string
                    example: "Something went wrong"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetEpisodeStatusHistoryFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    post:
      summary: Update episode status
      description: Updates episode status with prerequisite validation and triggers appropriate events
      tags: [Episodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["Draft", "Planning", "Ready", "Processing", "Published", "Archived"]
                  description: The new status to set for the episode
              required: [status]
            examples:
              ready_for_clip_gen:
                summary: Mark episode ready for clip generation
                value:
                  status: "Ready"
      responses:
        204:
          description: Status updated successfully
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid request data or status value
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode not found
        409:
          $ref: "#/components/responses/PrerequisiteNotMet"
          description: Prerequisites not met for status transition
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateEpisodeStatusFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/clips:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      summary: List clips for episode
      description: Retrieves all clips for a specific episode with current status computed from status history
      tags: [Clips]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextToken"
      responses:
        200:
          description: List of clips for the episode with paging
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClipListView"
                  nextToken:
                    type: string
                    description: Token for next page (only present if more items available)
                required:
                  - items
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListClipsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/clips/{clipId}:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/ClipId"
    get:
      summary: Get clip by ID
      description: Retrieves a specific clip with current status computed from status history
      tags: [Clips]
      responses:
        200:
          description: Clip details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipDetail"
        404:
          description: Episode or clip not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "NotFound"
                  message:
                    type: string
                    example: "Clip with ID 'clip-123' was not found in episode '123e4567-e89b-12d3-a456-426614174000'"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetClipFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    patch:
      summary: Update clip status
      description: Updates the status of a clip for review workflow (reviewed, approved, rejected, published)
      tags: [Clips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: ["Proposed", "Processing", "Created", "Failed"]
                  description: New status for the clip
              required:
                - status
      responses:
        200:
          description: Clip status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  clipId:
                    type: string
                    description: Clip identifier
                  episodeId:
                    type: string
                    description: Episode identifier
                  status:
                    type: string
                    description: Updated status
                  updatedAt:
                    type: string
                    format: date-time
                    description: Timestamp when status was updated
        400:
          description: Invalid request data or status value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "ValidationError"
                  message:
                    type: string
                    example: "Invalid status. Must be one of: Proposed, Processing, Created, Failed"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          description: Episode or clip not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "NotFound"
                  message:
                    type: string
                    example: "Clip with ID 'clip-123' was not found in episode '123e4567-e89b-12d3-a456-426614174000'"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Something went wrong"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateClipStatusFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    delete:
      summary: Delete clip
      description: Deletes a clip and all associated S3 files. Returns 204 on success or if clip doesn't exist (idempotent). Updates tenant statistics to increment clips deleted count.
      tags: [Clips]
      responses:
        204:
          description: Clip deleted successfully or clip not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteClipFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /episodes/{episodeId}/clips/{clipId}/play:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
      - $ref: "#/components/parameters/ClipId"
    get:
      summary: Play clip
      description: Generates a download URL for the clip video file and increments the view count. The clip must be in processed, approved, or published status to be playable.
      tags: [Clips]
      responses:
        200:
          description: Clip playback information with download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  clipId:
                    type: string
                    description: Clip identifier
                  episodeId:
                    type: string
                    description: Episode identifier
                  title:
                    type: string
                    description: Clip title
                  downloadUrl:
                    type: string
                    format: uri
                    description: Presigned S3 URL for downloading the clip video file
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the download URL expires (1 hour from generation)
                  duration:
                    type: string
                    description: Clip duration in HH:MM:SS format
                  fileSize:
                    type: integer
                    description: File size in bytes
                  viewCount:
                    type: integer
                    description: Updated view count after incrementing
                required:
                  - clipId
                  - episodeId
                  - title
                  - downloadUrl
                  - expiresAt
                  - viewCount
        400:
          $ref: "#/components/responses/BadRequest"
          description: Clip is not ready for playback
        401:
