              example: "flowchart TD\n    Start[Introduction & Hook] --> Concept1[Concept 1: Lambda]\n    Concept1 --> Example[Real-world Example]\n    Example --> Takeaways[Key Takeaways]\n    Takeaways --> End[Outro]"
