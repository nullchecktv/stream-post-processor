        httpMethod: POST
        type: aws_proxy
    post:
      summary: Create quote
      description: Creates a new quote manually for an episode. Graphic generation is triggered automatically via EventBridge.
      tags: [Quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 5
                  maxLength: 280
                  description: Quote text (5-280 characters)
                speaker:
                  type: string
                  minLength: 1
                  description: Speaker attribution
                timestamp:
                  type: string
                  pattern: '^\d{2}:\d{2}:\d{2}$'
                  description: Time in transcript (HH:MM:SS format)
                relevanceScore:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Relevance score (0-100)
                context:
                  type: string
                  description: Optional surrounding context
                showSpeaker:
                  type: boolean
                  default: true
                  description: Display speaker name in graphic
                showEpisodeTitle:
                  type: boolean
                  default: true
                  description: Display episode title in graphic
              required: [text, speaker, timestamp]
      responses:
        201:
          description: Quote created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique quote identifier
                required:
                  - id
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid request data - missing required fields or validation errors
        404:
          $ref: "#/components/responses/NotFound"
          description: Episode not found
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateQuoteFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

