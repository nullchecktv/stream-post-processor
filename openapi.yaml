      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateUserProfileFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /me/teams:
    post:
      summary: Set active team
      description: Sets the user's active team context or clears it for individual mode
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  description: Team ID to activate, or null to switch to individual mode
                  nullable: true
                  example: "team-123e4567-e89b-12d3-a456-426614174000"
      responses:
        200:
          description: Active team updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeTeamId:
                    type: string
                    nullable: true
                    description: Current active team ID
                  message:
                    type: string
                    description: Success message
                    example: "Active team updated successfully"
                  requiresTokenRefresh:
                    type: boolean
                    description: Always false - cache is automatically flushed server-side
                    example: false
                required: [activeTeamId, message, requiresTokenRefresh]
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid team ID or user not a member of specified team
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
          description: Team not found
        422:
          description: User not a member of specified team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "UnprocessableEntity"
                message: "User is not a member of the specified team"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SetActiveTeamFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /teams/{teamId}/members:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      summary: List team members
      description: |
        Retrieves a paginated list of team members and pending invitations:

        **Member information includes:**
        - User details (name, email, role)
        - Membership status and join date
        - Invitation details (who invited, when)

        **Role-based visibility:**
        - All team members can view the member list
        - Pending invitations only visible to owners and administrators
        - Member contact information visible to all team members

        **Pagination support:**
        - Default limit of 20 members per page
        - Maximum limit of 100 members per page
        - Cursor-based pagination for consistent results

        **Security considerations:**
        - Only team members can access this endpoint
        - Non-members receive 403 Forbidden response
        - Pending invitations filtered based on user role
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        200:
          description: List of team members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamMember"
                  pendingInvitations:
                    type: array
                    description: Pending invitations (only visible to owners and administrators)
                    items:
                      $ref: "#/components/schemas/PendingInvitation"
                  nextCursor:
                    type: string
                    nullable: true
                    description: Cursor for next page of results
                  hasMore:
                    type: boolean
                    description: Whether there are more results available
                required: [members, pendingInvitations, hasMore]
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not a member of this team
        404:
          $ref: "#/components/responses/NotFound"
          description: Team not found
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListTeamMembersFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
    post:
      summary: Add team member
      description: |
        Adds a new member to the team by email address. This endpoint handles both existing and non-existing users:

        **For existing users:**
        - Creates team membership record immediately
        - Sends welcome email notification
        - User gains access to team resources instantly

        **For non-existing users:**
        - Creates pending invitation record with 30-day expiration
        - Sends invitation email with registration link
        - Auto-links user to team when they register with the invited email

        **Role-based permissions:**
        - Only team owners and administrators can add members
        - New members default to "member" role unless specified
        - Cannot add users who are already team members

        **Email notifications:**
        - Invitation emails include team name, inviter name, and app URL
        - Welcome emails confirm successful team membership
        - All emails use professional templates with team branding
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the user to invite
                  example: "newmember@example.com"
                role:
                  type: string
                  enum: ["administrator", "member"]
                  default: "member"
                  description: Role to assign to the new member
                  example: "member"
              required: [email]
            examples:
              add_member:
                summary: Add regular member
                value:
                  email: "john.doe@example.com"
                  role: "member"
              add_administrator:
                summary: Add administrator
                value:
                  email: "admin@example.com"
                  role: "administrator"
              add_member_default_role:
                summary: Add member with default role
                value:
                  email: "newuser@example.com"
      responses:
        201:
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                    description: Email of the added member
                  role:
                    type: string
                    description: Role assigned to the member
                  status:
                    type: string
                    enum: ["Active", "Pending"]
                    description: Member status (Active if user exists, Pending if invitation sent)
                  invitationSent:
                    type: boolean
                    description: Whether an invitation email was sent
                  message:
                    type: string
                    description: Success message
                required: [email, role, status, invitationSent, message]
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid email format or role value
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not an owner or administrator of this team
        404:
          $ref: "#/components/responses/NotFound"
          description: Team not found
        409:
          description: User is already a member of this team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Conflict"
                message: "User is already a member of this team"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AddTeamMemberFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /teams/{teamId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/UserId"
    delete:
      summary: Remove team member
      description: |
        Removes a member from the team with optional permanent deletion:

        **Removal process:**
        - Without `confirmDelete=true`: Sets member status to 'inactive' (soft delete)
        - With `confirmDelete=true`: Permanently deletes team membership record
        - Clears user's active team if it matches the removed team (permanent deletion only)
        - Sends notification email based on action type

        **Query parameters:**
        - `confirmDelete=true`: Permanently delete the membership record
        - Without parameter: Set status to 'inactive' (default behavior)

        **Role-based permissions:**
        - Only team owners and administrators can remove members
        - Team owners cannot remove themselves (prevents orphaned teams)
        - Members cannot remove other members

        **Email notifications:**
        - Deactivated user receives notification about status change
        - Permanently removed user receives polite notification with team name
        - Team owner receives notification of member action

        **Security considerations:**
        - Inactive members lose access to team resources but record is preserved
        - Permanently deleted members lose all association with the team
        - Any active sessions continue until token expiration
        - Inactive members can be reactivated; deleted members must be re-invited
      tags: [Teams]
      parameters:
        - name: confirmDelete
          in: query
          required: false
          schema:
            type: boolean
          description: Set to true to permanently delete the membership record instead of setting status to inactive
      responses:
        204:
          description: Member removed successfully
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not an owner or administrator, or owner trying to remove themselves
        404:
          $ref: "#/components/responses/NotFound"
          description: Team or member not found
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RemoveTeamMemberFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /teams/{teamId}/members/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/UserId"
    put:
      summary: Update member role
      description: |
        Updates a team member's role and permissions within the team:

        **Available roles:**
        - **administrator**: Can add/remove members, view pending invitations
        - **member**: Basic team access, can view team resources
        - **owner**: Full team control (cannot be assigned via this endpoint)

        **Role-based permissions:**
        - Only team owners can change member roles
        - Team owners cannot change their own role (prevents privilege escalation)
        - Cannot promote members to owner role

        **Email notifications:**
        - Updated member receives role change notification
        - Email includes new role and updated permissions
        - Team owner receives confirmation of role change

        **Permission changes take effect:**
        - Immediately for new API requests
        - Existing sessions continue with old permissions until token refresh
        - User interface updates reflect new permissions on next page load
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: ["administrator", "member"]
                  description: New role for the member
                  example: "administrator"
              required: [role]
            examples:
              promote_to_admin:
                summary: Promote member to administrator
                value:
                  role: "administrator"
              demote_to_member:
                summary: Demote administrator to member
                value:
                  role: "member"
      responses:
        200:
          description: Member role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: User ID of the updated member
                  role:
                    type: string
                    description: New role assigned to the member
                  updatedAt:
                    type: string
                    format: date-time
                    description: When the role was updated
                  message:
                    type: string
                    description: Success message
                required: [userId, role, updatedAt, message]
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid role value
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not the team owner, or owner trying to change their own role
        404:
          $ref: "#/components/responses/NotFound"
          description: Team or member not found
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateMemberRoleFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /teams/{teamId}/members/me:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    delete:
      summary: Leave team
      description: |
        Allows a team member to voluntarily leave a team:

        **Leave process:**
        - Removes user's membership record
        - Clears active team if it matches the team being left
        - Sends confirmation email to departing member
        - Notifies team owner of member departure

        **Restrictions:**
        - Team owners cannot leave their own team (prevents orphaned teams)
        - Must transfer ownership or delete team before leaving
        - Members and administrators can leave freely

        **Email notifications:**
        - Departing member receives confirmation email
        - Team owner receives notification of member departure
        - Emails include team name and departure timestamp

        **Access revocation:**
        - User immediately loses access to team resources
        - Can be re-invited to the team if desired
        - All team-related data remains intact
      tags: [Teams]
      responses:
        204:
          description: Successfully left the team
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: Team owner cannot leave their own team
        404:
          $ref: "#/components/responses/NotFound"
          description: Team not found or user is not a member
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LeaveTeamFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /teams/{teamId}/invitations/{email}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - in: path
        name: email
        required: true
        schema:
          type: string
          format: email
        description: Email address of the invited user
    delete:
      summary: Cancel team invitation
      description: |
        Cancels a pending team invitation before it expires or is accepted:

        **Cancellation process:**
        - Removes the pending invitation record from the system
        - Sends cancellation notification email to the invitee
        - Prevents the user from joining the team with this invitation

        **Permission requirements:**
        - Only team owners and administrators can cancel invitations
        - Cannot cancel invitations that have already been accepted
        - Can only cancel invitations for the specified team

        **Email notifications:**
        - Invitee receives cancellation notification email
        - Email includes team name and original inviter information
        - Professional notification explaining the cancellation

        **Use cases:**
        - Invitation sent to wrong email address
        - Change in team requirements or structure
        - User no longer needs access to the team
        - Cleanup of old pending invitations
      tags: [Teams]
      responses:
        204:
          description: Invitation cancelled successfully
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invitation cannot be cancelled (already accepted or expired)
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
          description: User is not a team owner or administrator
        404:
          $ref: "#/components/responses/NotFound"
          description: Team or invitation not found
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CancelInvitationFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /invitations/{invitationId}/decisions:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the invitation
    post:
      summary: Accept or reject team invitation
      description: |
        Allows an invited user to accept or reject a team invitation:

        **Accept invitation:**
        - Creates team membership with the role specified in the invitation
        - Removes the invitation notification from the user's notification list
        - Marks the invitation as accepted

        **Reject invitation:**
        - Marks the invitation as rejected
        - Removes the invitation notification from the user's notification list
        - Does not create team membership

        **Validation:**
        - Only the invited user can act on their invitation
        - Invitations must be in pending status
        - Expired invitations cannot be accepted or rejected
        - Users cannot accept invitations to teams they're already members of

      tags: [Invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: ["accept", "reject"]
                  description: Action to take on the invitation
              required: [action]
            examples:
              accept:
                summary: Accept invitation
                value:
                  action: "accept"
              reject:
                summary: Reject invitation
                value:
                  action: "reject"
      responses:
        200:
          description: Invitation decision processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  teamId:
                    type: string
                    description: Team ID (only for accepted invitations)
                  teamName:
                    type: string
                    description: Team name (only for accepted invitations)
                  role:
                    type: string
                    description: User's role in the team (only for accepted invitations)
                required: [message]
              examples:
                accepted:
                  summary: Invitation accepted
                  value:
                    message: "Invitation accepted successfully"
                    teamId: "team-123"
                    teamName: "Content Team Alpha"
                    role: "member"
                rejected:
                  summary: Invitation rejected
                  value:
                    message: "Invitation rejected successfully"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          description: Not authorized to act on this invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Not authorized to act on this invitation"
        404:
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Invitation not found"
        409:
          description: Invitation already processed or user already a team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_processed:
                  summary: Invitation already processed
                  value:
                    message: "Invitation has already been accepted"
                already_member:
                  summary: User already a team member
                  value:
                    message: "User is already a member of this team"
        410:
          description: Invitation has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Invitation has expired"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MakeInvitationDecisionFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /notifications:
    get:
      summary: List notifications
      description: Gets a paginated list of notifications for the authenticated user
      tags: [Notifications]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/NextToken"
        - name: isRead
          in: query
          description: Filter notifications by read status
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        200:
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  nextToken:
                    type: string
                    description: Token for next page of results
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListNotificationsFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

  /notifications/{notificationId}:
    delete:
      summary: Delete or mark notification as read
      description: Deletes a notification or marks it as read based on query parameter
      tags: [Notifications]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
        - name: isRead
          in: query
          description: If 'true', marks notification as read instead of deleting
          required: false
          schema:
            type: string
            enum: ["true"]
      responses:
        204:
          description: Notification deleted or marked as read successfully
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/InternalError"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteNotificationFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy

components:
  parameters:
    EpisodeId:
      in: path
      name: episodeId
      required: true
      schema:
        type: string
    TrackName:
      in: path
      name: trackName
      required: true
      schema:
        type: string
    ClipId:
      in: path
      name: clipId
      required: true
      schema:
        type: string
    QuoteId:
      in: path
      name: quoteId
      required: true
      schema:
        type: string
    TeamId:
      in: path
      name: teamId
      required: true
      schema:
        type: string
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 10
      description: Number of items to return (default 10, max 25)
    NextToken:
      in: query
      name: nextToken
      required: false
      schema:
        type: string
      description: Token for retrieving the next page of results
    TeamLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items to return (default 20, max 100)
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Pagination cursor for next page
  schemas:
    Branding:
      type: object
      description: Branding configuration for quote graphics
      properties:
        colors:
          type: object
          description: Brand color palette
          properties:
            primary:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: Primary brand color (used for borders)
              example: "#3B82F6"
            secondary:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: Secondary brand color (used for accents)
              example: "#8B5CF6"
            background:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: Background color
              example: "#1F2937"
            text:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: Text color
              example: "#F9FAFB"
          required:
            - primary
            - secondary
            - background
            - text
        fontFamily:
          type: string
          minLength: 1
          maxLength: 100
          description: Font family for text rendering
          example: "Inter"
        voice:
          type: object
          description: Brand voice configuration for AI-generated content
          properties:
            tone:
              type: string
              minLength: 1
              maxLength: 200
              description: Desired tone for generated content
              example: "professional and conversational"
            writingStyle:
              type: string
              minLength: 1
              maxLength: 500
              description: Desired writing style for generated content
              example: "technical with practical examples"
            perspective:
              type: string
              enum:
                - first_person
                - third_person
              default: first_person
              description: Writing perspective for generated content. first_person uses "I/we/my/our", third_person uses "they/the team/the author"
              example: "first_person"
      required:
        - colors
        - fontFamily

    EpisodeListView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          description: Current episode status computed from the most recent status history entry
        airDate:
          type: string
          format: date-time
      required:
        - id
        - title

    ClipListView:
      type: object
      properties:
        id:
          type: string
          description: Unique clip identifier
        title:
          type: string
          description: Clip title
        status:
          type: string
          description: Current clip status computed from status history
          enum:
            [
              "Proposed",
              "Processing",
              "Created",
              "Failed",
            ]
        duration:
          type: string
          description: Duration of the clip (HH:MM:SS format)
          example: "00:02:15"
        type:
          type: string
          description: Clip type identifier
      required:
        - id
        - title
        - status
        - duration
        - type

    Episode:
      type: object
      properties:
        id:
          type: string
          description: Unique episode identifier
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          description: Episode title
          example: "Tech Talk Episode 42"
        status:
          type: string
          description: Current episode status
          example: "Ready"
        episodeNumber:
          type: integer
          description: Episode number in the series
          example: 42
        description:
          type: string
          description: Episode description (optional)
          example: "Discussion about AI and machine learning"
        summary:
          type: string
          description: Episode summary or description (optional)
          example: "Discussion about AI and machine learning"
        airDate:
          type: string
          format: date-time
          description: When the episode was aired (optional)
          example: "2025-01-15T10:30:00Z"
        platforms:
          type: array
          description: Platforms where the episode was published (optional)
          items:
            type: string
            enum: ["linkedin live", "X", "twitch", "youtube"]
          example: ["twitch", "youtube"]
        themes:
          type: array
          description: Episode themes or topics (optional)
          items:
            type: string
          example: ["technology", "programming"]
        seriesName:
          type: string
          description: Name of the series this episode belongs to (optional)
          example: "Tech Talk Series"
        metrics:
          type: object
          description: Episode metrics and counts
          properties:
            tracksCount:
              type: integer
              description: Number of video tracks uploaded
              example: 2
            hasTranscript:
              type: boolean
              description: Whether a transcript has been uploaded
              example: true
            clipsCount:
              type: integer
              description: Number of clips detected or generated
              example: 5
          required:
            - tracksCount
            - hasTranscript
            - clipsCount
        createdAt:
          type: string
          format: date-time
          description: When the episode was created
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When the episode was last updated
          example: "2025-01-15T10:35:00Z"
