                - "DynamoDB single-table design patterns"
                - "Cost optimization strategies for serverless"
            detailedOutline:
              type: array
              items:
                type: object
                properties:
                  section:
                    type: string
                    description: Section name/title
                    example: "Lambda Function Basics"
                  duration:
                    type: string
                    description: Estimated duration
                    example: "8-10 minutes"
                  talkingPoints:
                    type: array
                    items:
                      type: string
                    description: Specific topics to discuss
                    example:
                      - "What is a Lambda function and when to use it"
                      - "Event-driven architecture patterns"
                      - "Cold starts vs warm starts"
                  demoArtifacts:
                    type: array
                    items:
                      type: string
                    description: Code examples, diagrams, or demos to show
                    example:
                      - "Simple Lambda function code example"
                      - "AWS Console walkthrough"
                required:
                  - section
                  - duration
                  - talkingPoints
              minItems: 3
              description: Detailed section-by-section breakdown
            generatedAt:
              type: string
              format: date-time
              description: When recommendations were generated
              example: "2025-01-15T10:35:00Z"
          required:
            - suggestedFlow
            - proposedTitle
            - proposedDescription
            - keyLearningMoments
            - detailedOutline
            - generatedAt
      required:
        - episodeId
        - plan

