          description: Markdown formatted blog outline
          example: "# Blog Post Title\n\n## Introduction\n\n## Main Content\n\n## Conclusion"
        content:
          type: string
          nullable: true
          description: Full blog post content in markdown format
          example: "# Mastering Serverless Architecture\n\nIn this comprehensive guide..."
        status:
          type: string
          enum:
            - Proposed
            - Processing
            - Created
            - Failed
            - Edited
          description: Current status of the blog
          example: "Created"
        wordCount:
          type: integer
          nullable: true
          description: Word count of the blog content
          example: 1847
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the blog was created
          example: "2025-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the blog was last updated
          example: "2025-01-15T10:35:00Z"
      required:
        - episodeId
        - outline
        - content
        - status

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation_error:
              summary: Validation error
              value:
                message: "title is required, episodeNumber is required and must be a number"
            invalid_speakers:
              summary: Invalid speakers array
              value:
                error: "ValidationError"
                message: "Speaker names must be non-empty strings"
            empty_speaker_name:
              summary: Empty speaker name
              value:
                error: "ValidationError"
                message: "Speaker name cannot be empty or contain only whitespace"
            invalid_email:
              summary: Invalid email format
              value:
                error: "ValidationError"
                message: "Invalid email address format"
            invalid_role:
              summary: Invalid role value
              value:
                error: "ValidationError"
                message: "Role must be either 'administrator' or 'member'"
            missing_email:
              summary: Missing required email
              value:
                error: "ValidationError"
                message: "Email address is required"
            missing_role:
              summary: Missing required role
              value:
                error: "ValidationError"
                message: "Role is required"

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Unauthorized"
            message: "Valid JWT token required"

    Forbidden:
      description: Access denied - user lacks required permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            team_access_denied:
              summary: Team access denied
              value:
                error: "Forbidden"
                message: "User is not a member of this team"
            owner_required:
              summary: Owner privileges required
              value:
                error: "Forbidden"
                message: "Only team owners can perform this action"
            admin_required:
              summary: Administrator privileges required
              value:
                error: "Forbidden"
                message: "Only team owners and administrators can perform this action"
            cannot_remove_self:
              summary: Owner cannot remove themselves
              value:
                error: "Forbidden"
                message: "Team owners cannot remove themselves from the team"
            cannot_change_own_role:
              summary: Owner cannot change own role
              value:
                error: "Forbidden"
                message: "Team owners cannot change their own role"
            cannot_leave_own_team:
              summary: Owner cannot leave own team
              value:
                error: "Forbidden"
                message: "Team owners cannot leave their own team"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            episode_not_found:
              summary: Episode not found
              value:
                error: "NotFound"
                message: "Episode with ID '123e4567-e89b-12d3-a456-426614174000' was not found"
            track_not_found:
              summary: Track not found
              value:
                error: "NotFound"
                message: "Track 'main' not found for episode '123e4567-e89b-12d3-a456-426614174000'"

    PrerequisiteNotMet:
      description: Prerequisites not met for the requested operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PrerequisiteError"
          examples:
            episode_not_ready:
              summary: Episode not ready for clip generation
              value:
                error: "PrerequisiteNotMet"
                message: "Episode is not ready for clip generation"
                details:
                  missingPrerequisites:
                    - "Episode has status 'Draft', expected 'Track(s) Uploaded'"
                    - "Track 'guest' has status 'Unprocessed', expected 'Processed'"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "InternalError"
            message: "Something went wrong"
