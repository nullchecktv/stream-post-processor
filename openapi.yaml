              type: string
              minLength: 50
              maxLength: 1000
              description: AI-generated promotional description
              example: "Join us for an in-depth exploration of serverless architecture patterns..."
            keyLearningMoments:
              type: array
              items:
                type: string
              minItems: 1
              description: Key learning moments or takeaways
              example:
